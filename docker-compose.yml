version: '3.9'

services:
  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:15-alpine
    container_name: cmnd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-vr_learning}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-vr_learning_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-vr_learning}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cmnd-network

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: cmnd-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cmnd-network

  # ==================== Backend (Node.js/Express) ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cmnd-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-vr_learning}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-vr_learning_db}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_URL: http://localhost:5000
      CORS_ORIGIN: http://localhost:3000
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-52428800}
      EXPORT_SAMPLE_PATH: /app/frontend-public/template.xlsx
      REFERENCE_DEFAULT_DIR: /app/frontend-public
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./frontend/public:/app/frontend-public:ro
      - /app/node_modules
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    command: npm run dev
    networks:
      - cmnd-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5000/health']
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== Frontend (React/Vite) ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: cmnd-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
      VITE_ENV: development
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - cmnd-network

  # ==================== Database Admin UI ====================
  adminer:
    image: adminer:latest
    container_name: cmnd-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - cmnd-network
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_READONLY: "false"

  # ==================== Redis Admin UI ====================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: cmnd-redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      - redis
    environment:
      REDIS_HOSTS: local:redis:6379
    networks:
      - cmnd-network

# ==================== VOLUMES ====================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local

# ==================== NETWORKS ====================
networks:
  cmnd-network:
    driver: bridge
